<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>SSAdesk — Lousa</title>
  <link rel="stylesheet" href="lousa.css">
</head>
<body class="desenhar">
  <canvas id="tela"></canvas>

  <nav class="ferramentas" id="ferramentas" aria-label="Lousa">
    <button class="f ativa" data-ferr="caneta" title="Caneta" aria-label="Caneta">
      <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.6 5a2.1 2.1 0 0 1 3 3L8.2 18.4z"/><path d="M14 6.6l3 3"/></svg>
    </button>
    <button class="f" data-ferr="marca" title="Marca-texto" aria-label="Marca-texto">
      <svg viewBox="0 0 24 24"><path d="M9 15l-3 3h4l1.5-1.5M9 15l8.5-8.5a2.1 2.1 0 0 1 3 3L12 18M9 15l3 3"/><path d="M3 21h8"/></svg>
    </button>
    <button class="f" data-ferr="borracha" title="Borracha: apaga o traço em que passar por cima" aria-label="Borracha">
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4a1.8 1.8 0 0 1 0 2.5L11 19.5H7l-3-3a1.8 1.8 0 0 1 0-2.5L13 4.5a1.8 1.8 0 0 1 2.5 0z"/><path d="M9 10.5l5.5 5.5M7 19.5h13"/></svg>
    </button>
    <span class="sep"></span>
    <button class="cor ativa" data-cor="#ff3b30" aria-label="Vermelho"></button>
    <button class="cor" data-cor="#0a84ff" aria-label="Azul"></button>
    <button class="cor" data-cor="#30d158" aria-label="Verde"></button>
    <button class="cor" data-cor="#ffd60a" aria-label="Amarelo"></button>
    <button class="cor" data-cor="#1d1d1f" aria-label="Preto"></button>
    <span class="sep"></span>
    <button class="f" id="modo" title="Alternar entre desenhar e usar o mouse" aria-label="Usar o mouse">
      <svg class="m-mouse" viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1L15 19l-2.5 1.2-2.6-6L6 17z"/></svg>
    </button>
    <button class="txt" id="limpar" title="Limpar tudo (para os dois)">Limpar tudo</button>
    <button class="f fechar" id="fechar" title="Fechar a lousa" aria-label="Fechar a lousa">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </nav>
  <div class="aviso" id="aviso"></div>
  <script src="lousa.js"></script>
</body>
</html>
