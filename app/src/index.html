<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>SSADesk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i></div>

  <header class="titlebar">
    <div class="winctl" role="group" aria-label="Janela">
      <button class="wbtn" data-acao="minimizar" aria-label="Minimizar"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
      <button class="wbtn close" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
    <div class="brand"><img src="../assets/icon.png" alt=""><span>SSADesk</span></div>
  </header>

  <main>
    <section class="hero glass reveal" style="--d:0">
      <p class="eyebrow">Este computador</p>
      <button class="code" id="codigo" title="Copiar código">— — —</button>
      <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Verificando rede</span></div>
    </section>

    <section class="row glass reveal" style="--d:1">
      <div class="row-text">
        <p class="label">Chave de internet</p>
        <p class="mono" id="chave">—</p>
      </div>
      <button class="icon-btn" id="copiarChave" aria-label="Copiar chave">
        <svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.6"/><path d="M15.5 8.5V6.6A2.1 2.1 0 0 0 13.4 4.5H6.6A2.1 2.1 0 0 0 4.5 6.6v6.8a2.1 2.1 0 0 0 2.1 2.1h1.9"/></svg>
      </button>
    </section>

    <button class="row glass reveal call-row" style="--d:2" id="chamada">
      <span class="call-ico"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg></span>
      <span class="row-text"><span class="call-title">Chamada de vídeo</span><span class="label">Câmera e microfone, separado do acesso</span></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>
    </button>

    <section class="connect glass reveal" style="--d:3">
      <p class="eyebrow">Conectar</p>
      <form id="form" class="field" autocomplete="off">
        <input id="destino" placeholder="IP ou chave de internet" spellcheck="false" aria-label="IP ou chave de internet">
        <button class="go" id="go" aria-label="Conectar">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg>
          <span class="spinner"></span>
        </button>
      </form>
      <p class="hint" id="msg">Mesma rede: IP. Qualquer lugar: chave.</p>
    </section>
  </main>

  <footer class="reveal" style="--d:4">
    <div class="segmented" id="tema" role="radiogroup" aria-label="Aparência">
      <span class="thumb"></span>
      <button role="radio" data-tema="system">Automático</button>
      <button role="radio" data-tema="light">Claro</button>
      <button role="radio" data-tema="dark">Escuro</button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status">Copiado</div>
  <script src="renderer.js"></script>
</body>
</html>
