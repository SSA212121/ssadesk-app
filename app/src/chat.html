<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>SSADesk — Mensagens</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="topo">
    <span class="titulo">Mensagens</span>
    <div class="winctl">
      <button class="wbtn" data-acao="minimizar" aria-label="Minimizar"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
      <button class="wbtn close" data-acao="guardar" aria-label="Guardar mensagens"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
  </header>
  <ol class="msgs" id="msgs"><li class="vazio" id="vazio">Escreva aqui se preferir não usar o microfone.</li></ol>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <input id="chatTexto" placeholder="Mensagem" maxlength="2000" spellcheck="true">
    <button class="enviar" id="enviar" aria-label="Enviar" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
  <script src="chat-janela.js"></script>
</body>
</html>
