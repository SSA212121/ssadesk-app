<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>SSAdesk</title>
  <link rel="stylesheet" href="sessao.css">
</head>
<body>
  <div class="pilula" id="pilula">
    <div class="quem">
      <span class="avatar" id="inicial">?</span>
      <span class="textos">
        <span class="nome" id="nome">Conectado</span>
        <span class="estado" id="estado"></span>
      </span>
    </div>
    <div class="botoes">
      <button class="b" data-acao="arquivos" title="Enviar arquivos" aria-label="Enviar arquivos">
        <svg viewBox="0 0 24 24"><path d="M20.5 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
      </button>
      <button class="b chat-b" data-acao="chat" title="Chat" aria-label="Chat"><span class="selo" id="selo"></span>
        <svg viewBox="0 0 24 24"><path d="M12 4.5c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-.9 0-1.8-.1-2.6-.3L5 20l1.1-3.6C4.5 15.1 3.5 13.4 3.5 11.5c0-3.9 3.8-7 8.5-7z"/></svg>
      </button>
      <button class="b" data-acao="lousa" title="Lousa: desenhar e anotar na tela" aria-label="Lousa">
        <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.6 5a2.1 2.1 0 0 1 3 3L8.2 18.4z"/><path d="M14 6.6l3 3"/></svg>
      </button>
      <button class="b" data-acao="tela" title="Transmitir minha tela" aria-label="Transmitir minha tela">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20M12 13V8M9.5 10.5L12 8l2.5 2.5"/></svg>
      </button>
      <button class="b" data-acao="chamada" title="Chamada de vídeo" aria-label="Chamada de vídeo">
        <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg>
      </button>
      <button class="b" data-acao="mais" title="Mais opções" aria-label="Mais opções">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>
      </button>
      <button class="b" data-acao="info" title="Informações da conexão" aria-label="Informações da conexão">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><path d="M12 7.6v.1" stroke-width="2.4"/></svg>
      </button>
      <button class="b fim" data-acao="encerrar" title="Encerrar conexão" aria-label="Encerrar conexão">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div class="barra-prog" id="prog"><i id="progFill"></i></div>
  </div>
  <script src="dica.js"></script>
  <script src="sessao.js"></script>
</body>
</html>
