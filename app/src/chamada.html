<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:">
  <title>SSADesk — Chamada</title>
  <link rel="stylesheet" href="chamada.css">
</head>
<body>
  <!-- Vídeo do outro lado (tela cheia) -->
  <video id="remoto" autoplay playsinline></video>
  <div class="aguardando" id="aguardando">
    <div class="avatar"><img src="../assets/icon.png" alt=""></div>
    <p class="nome" id="nome">Chamada</p>
    <p class="estado" id="estado">Aguardando o outro lado</p>
  </div>

  <!-- Barra superior (arrastar a janela) -->
  <header class="topo">
    <div class="winctl">
      <button class="wbtn" data-acao="tela-cheia" aria-label="Tela cheia"><svg viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
      <button class="wbtn" data-acao="minimizar" aria-label="Minimizar"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
      <button class="wbtn close" data-acao="fechar" aria-label="Fechar"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
    <span class="tempo" id="tempo"></span>
  </header>

  <!-- Seu vídeo (PiP arrastável) -->
  <div class="pip" id="pip">
    <video id="local" autoplay playsinline muted></video>
    <span class="pip-resize" id="pipResize" title="Arraste para redimensionar"></span>
    <div class="pip-off" id="pipOff"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.5 6.5H14a2 2 0 0 1 2 2v1.5l4-2.5v9M16 16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h.5"/></svg></div>
  </div>

  <!-- Controles flutuantes -->
  <nav class="controles" id="controles" aria-label="Controles da chamada">
    <button class="ctl" id="mic" aria-label="Microfone" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17M9 9v2a3 3 0 0 0 5.1 2.1M15 9.6V6a3 3 0 0 0-5.7-1.3M5.5 11a6.5 6.5 0 0 0 10.4 5.2M18.4 13a6.5 6.5 0 0 0 .1-2M12 17.5V21"/></svg>
    </button>
    <button class="ctl" id="cam" aria-label="Câmera" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.5 6.5H13.5a2.5 2.5 0 0 1 2.5 2.5v1.5l5-3v9M16 16a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 16V9a2.5 2.5 0 0 1 2.5-2.5"/></svg>
    </button>
    <button class="ctl fim" id="encerrar" aria-label="Encerrar chamada">
      <svg viewBox="0 0 24 24"><path d="M3.2 14.6c-.4-.4-.4-1.1 0-1.5C5.6 10.8 8.7 9.6 12 9.6s6.4 1.2 8.8 3.5c.4.4.4 1.1 0 1.5l-1.7 1.7c-.4.4-1 .4-1.4.1l-2-1.5a1 1 0 0 1-.4-.8v-2.1a10 10 0 0 0-6.6 0v2.1c0 .3-.2.6-.4.8l-2 1.5c-.4.3-1 .3-1.4-.1z"/></svg>
    </button>
  </nav>

  <div class="aviso" id="aviso" role="status"></div>
  <script src="chamada.js"></script>
</body>
</html>
